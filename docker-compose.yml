services:
  backend:
    build:
      context: ./backend
    image: effective-mobile-backend:latest
    container_name: effective-mobile-backend
    restart: unless-stopped
    networks:
      - internal
    # backend не публикует порты наружу

  nginx:
    image: nginx:1.25-alpine
    container_name: effective-mobile-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      - backend

networks:
  internal:
    driver: bridge
    name: effective-mobile-net